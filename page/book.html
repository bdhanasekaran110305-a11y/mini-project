<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Management</title>

    <link rel="stylesheet" href="../css/book.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            📚 Library Management System
        </div>

        <a href="../dashboard.html">
            Dashboard
        </a>

    </header>


    <!-- MAIN -->

    <main class="container">

        <h1>Book Management</h1>

        <p class="description">
            View and manage library books.
        </p>


        <!-- ADD BOOK BUTTON -->

        <button id="addBookBtn" class="add-btn">
            + Add Book
        </button>


        <!-- SUCCESS MESSAGE -->

        <p id="successMessage" class="success"></p>


        <!-- ADD BOOK FORM -->

        <div id="bookFormContainer" class="form-container">

            <h2>Add New Book</h2>

            <form id="bookForm">

                <label>Book ID</label>

                <input
                    type="text"
                    id="bookId"
                    placeholder="Enter Book ID"
                    required
                >


                <label>Book Name</label>

                <input
                    type="text"
                    id="bookName"
                    placeholder="Enter Book Name"
                    required
                >


                <label>Author</label>

                <input
                    type="text"
                    id="author"
                    placeholder="Enter Author"
                    required
                >


                <label>Category</label>

                <input
                    type="text"
                    id="category"
                    placeholder="Enter Category"
                    required
                >


                <label>Publisher</label>

                <input
                    type="text"
                    id="publisher"
                    placeholder="Enter Publisher"
                    required
                >


                <label>Year</label>

                <input
                    type="number"
                    id="year"
                    placeholder="Enter Year"
                    required
                >


                <label>Quantity</label>

                <input
                    type="number"
                    id="quantity"
                    placeholder="Enter Quantity"
                    min="1"
                    required
                >


                <div class="form-buttons">

                    <button type="submit" class="save-btn">
                        Save Book
                    </button>

                    <button type="button"
                            id="cancelBtn"
                            class="cancel-btn">
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <!-- BOOK TABLE -->

        <h2 class="table-title">
            Book List
        </h2>


        <table>

            <thead>

                <tr>

                    <th>Book ID</th>

                    <th>Book Name</th>

                    <th>Author</th>

                    <th>Category</th>

                    <th>Publisher</th>

                    <th>Year</th>

                    <th>Quantity</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="bookTableBody">

            </tbody>

        </table>

    </main>


    <!-- JAVASCRIPT -->

    <script src="book.js"></script>

</body>

</html>
