<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="css/mini.css">
</head>

<body>

    <div class="container">

        <h2>Admin Login</h2>

        <form id="loginForm">

            <!-- USER NAME -->
            <label for="username">User Name</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter User Name"
                pattern="[A-Za-z ]+"
                title="User Name must contain letters only"
                required
            >

            <!-- PASSWORD -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                pattern="[0-9]+"
                title="Password must contain numbers only"
                required
            >

            <!-- LOGIN BUTTON -->
            <button type="submit">Login</button>

            <!-- RESET BUTTON -->
            <button type="reset">Reset</button>

            <!-- ERROR MESSAGE -->
            <p id="errorMessage"></p>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>


   <script src="js/log.js"></script>


    

</body>

</html>
